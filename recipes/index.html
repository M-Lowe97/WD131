<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="A lovely mockup of what recipe book webpage would look like.">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="images/apple-crisp.jpg">

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="A lovely mockup of what a recipe book webpage would look like.">
    <meta name="twitter:image" content="images/apple-crisp.jpg">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
                
    <title>Recipe Book</title>

    <link type="text/css" rel="stylesheet" href="index.css">
</head>
<body>
    <header></header>

    <main>

        <div id="hero">
            <img src="images/recipe-book.png" alt="recipe book">
            <h1>RecipeBook</h1>
        </div>

        <div class="search-bar">
            <input type="search" id="recipe-search" name="search" placeholder="Find a recipe">
            <img src="images/search.svg" alt="search icon">
        </div>

        <div class="review-card">
            <img src="images/apple-crisp.jpg" alt="Apple Crisp">


            <span
            class="rating"
            role="img"
            aria-label="Rating: 4 out of 5 stars"
            >
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>
        </div>


        


        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                  
                
        

                
    </main>

    <footer>
    <a href="https://www.flaticon.com/free-icons/recipe-book" title="recipe book icons">Recipe book icons created by nawicon - Flaticon</a>
    </footer>
</body>
</html>
