<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="Character card practice">
    <meta property="og:url" content="https://">
    <meta property="og:image" content="https://yourURLofSocialPreviewImageHere.png">
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="Character card practice">
    <meta name="twitter:image" content="https://yourURLofSocialPreviewImageHere.png">
    <title>Harold, the Handsome Lizard-Character card</title>
    <link rel="stylesheet" href="charactercard.css">
    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">
    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
    <script src="charactercard.js" defer></script>
</head>
<body>
    <article class="card">
        <img src="snortleblat.webp" alt="Our dashing hero." class="image" loading="eager">
        <div class="name">
            <p>Harold</p>
        </div>
        <div class="stats">
            <p>
                Class: Handsome Lizard
            </p>
            <p>
                Level: <span id="level">3</span>
            </p>
            <p>
                Health <span id="hp">30</span>
            </p>

            <button class="buttons">
                <div>Attack</div>
            </button>

            <button class="buttons">
                <div>Level Up</div>
            </button>
        </div>


    </article>
</body>
</html>
